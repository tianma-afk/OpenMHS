[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-hardware-standard"
version = "0.1.0"
description = "A hardware server for discover, recognizition, registerition, facility"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "psutil>=5.9,<8",
    "pyvisa>=1.15.0,<2",
    "pyvisa-py[hislip-discovery,usb-full]>=0.8.1,<1",
    "mcp>=1.0.0,<2.0.0",
    "fastapi-mcp>=0.4.0",
    "apscheduler>=3.11.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
mhs = "model_hardware_standard.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/model_hardware_standard"]
